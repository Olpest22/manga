<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Манга</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --panel:rgba(20,20,22,.94);
    --panel-solid:#141416;
    --fg:#ecebe8;
    --dim:#8d8d93;
    --line:#26262a;
    --accent:#f2c14e;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);}
  body{font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;}
  a{color:inherit;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  [hidden]{display:none !important;}

  /* ---------- home ---------- */
  .home{max-width:640px;margin:0 auto;padding:calc(2.5rem + var(--safe-t)) 1.25rem calc(3rem + var(--safe-b));}
  .home h1{font-size:1.75rem;font-weight:600;margin:0 0 .25rem;letter-spacing:-.01em;}
  .home .sub{color:var(--dim);margin:0 0 2rem;font-size:.95rem;}
  .continue{
    display:flex;align-items:center;gap:1rem;text-decoration:none;
    background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;
    padding:1rem 1.1rem;margin-bottom:2rem;
  }
  .continue:hover{border-color:#3a3a40;}
  .continue .play{
    flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#1a1400;
    display:grid;place-items:center;
  }
  .continue .t{font-weight:600;}
  .continue .s{color:var(--dim);font-size:.88rem;}
  ol.chapters{list-style:none;margin:0;padding:0;counter-reset:ch;}
  ol.chapters li{border-top:1px solid var(--line);}
  ol.chapters li:last-child{border-bottom:1px solid var(--line);}
  ol.chapters a{display:grid;grid-template-columns:2.2rem 1fr auto;align-items:center;gap:.25rem .75rem;padding:1rem .25rem;text-decoration:none;}
  ol.chapters a:hover .ct{color:#fff;}
  ol.chapters .n{color:var(--dim);font-variant-numeric:tabular-nums;font-size:.9rem;}
  ol.chapters .ct{font-weight:500;}
  ol.chapters .cp{color:var(--dim);font-size:.85rem;font-variant-numeric:tabular-nums;}
  ol.chapters .bar{grid-column:2 / 4;height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
  ol.chapters .bar i{display:block;height:100%;background:var(--accent);}
  .empty{color:var(--dim);padding:4rem 1.5rem;text-align:center;line-height:1.7;max-width:480px;margin:0 auto;}
  .empty code{color:var(--fg);}

  /* ---------- reader ---------- */
  .reader{position:fixed;inset:0;background:var(--bg);overflow:hidden;}
  .bar{
    position:fixed;left:0;right:0;z-index:10;
    background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    display:flex;align-items:center;gap:.5rem;
    transition:transform .22s ease, opacity .22s ease;
  }
  .bar.top{top:0;padding:calc(.5rem + var(--safe-t)) .5rem .5rem;border-bottom:1px solid var(--line);}
  .bar.bottom{bottom:0;padding:.6rem .75rem calc(.6rem + var(--safe-b));border-top:1px solid var(--line);}
  .ui-hidden .bar.top{transform:translateY(-100%);opacity:0;pointer-events:none;}
  .ui-hidden .bar.bottom{transform:translateY(100%);opacity:0;pointer-events:none;}

  .icon-btn{
    flex:none;width:44px;height:44px;border-radius:10px;border:0;background:none;cursor:pointer;
    display:grid;place-items:center;text-decoration:none;color:var(--fg);
  }
  .icon-btn:hover{background:rgba(255,255,255,.07);}
  .icon-btn:disabled{opacity:.3;cursor:default;background:none;}
  .icon-btn svg{width:22px;height:22px;}
  .where{flex:1;min-width:0;text-align:center;line-height:1.25;}
  .where .ch{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .where .pg{color:var(--dim);font-size:.8rem;font-variant-numeric:tabular-nums;}

  input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px;cursor:pointer;}

  .stage{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}

  /* page mode */
  .page-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;}
  .page-wrap img{display:block;user-select:none;-webkit-user-drag:none;transition:opacity .15s;}
  .fit-contain .page-wrap img{max-width:100vw;max-height:100vh;max-height:100dvh;object-fit:contain;}
  .fit-width .page-wrap{align-items:flex-start;}
  .fit-width .page-wrap img{width:100%;max-width:900px;height:auto;}
  .page-wrap.loading img{opacity:.25;}
  .spinner{position:fixed;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
    border:3px solid rgba(255,255,255,.15);border-top-color:var(--fg);animation:spin .8s linear infinite;z-index:2;pointer-events:none;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* strip mode */
  .strip{max-width:900px;margin:0 auto;padding:calc(60px + var(--safe-t)) 0 calc(80px + var(--safe-b));}
  .strip img{display:block;width:100%;height:auto;background:#0d0d0e;}
  .strip img:not(.ok){aspect-ratio:2/3;}
  .chapter-end{text-align:center;padding:3rem 1.25rem;color:var(--dim);}
  .btn{
    display:inline-flex;align-items:center;gap:.5rem;margin-top:1rem;
    padding:.8rem 1.3rem;border-radius:12px;border:0;cursor:pointer;text-decoration:none;
    background:var(--accent);color:#1a1400;font-weight:600;
  }
  .btn.ghost{background:none;color:var(--fg);border:1px solid var(--line);}

  .img-error{color:var(--dim);text-align:center;padding:3rem 1rem;}

  /* settings sheet */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;}
  .sheet{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:21;
    width:min(480px,100%);background:var(--panel-solid);border:1px solid var(--line);border-bottom:0;
    border-radius:18px 18px 0 0;padding:1.25rem 1.25rem calc(1.5rem + var(--safe-b));
  }
  .sheet h2{font-size:1rem;font-weight:600;margin:0 0 1rem;}
  .opt{margin-bottom:1.1rem;}
  .opt .lbl{color:var(--dim);font-size:.85rem;margin-bottom:.4rem;}
  .seg{display:flex;background:#0b0b0c;border:1px solid var(--line);border-radius:11px;padding:3px;}
  .seg button{flex:1;border:0;background:none;padding:.6rem .4rem;border-radius:8px;cursor:pointer;font-size:.9rem;color:var(--dim);}
  .seg button[aria-pressed="true"]{background:#2a2a2f;color:var(--fg);}
  .hint{color:var(--dim);font-size:.8rem;line-height:1.6;margin-top:.5rem;}
  kbd{font-family:inherit;border:1px solid var(--line);border-radius:4px;padding:0 .3rem;font-size:.75rem;}

  .toast{
    position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:30;
    background:var(--panel-solid);border:1px solid var(--line);padding:.7rem 1.1rem;border-radius:12px;
    font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .toast.show{opacity:1;}

  @media (prefers-reduced-motion: reduce){
    .bar,.toast,.page-wrap img{transition:none;}
    .spinner{animation-duration:2s;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const MANIFEST_URL = 'manga/manifest.json';

/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const settings = Object.assign({mode:'page', fit:'contain', dir:'ltr'}, store.get('reader-settings', {}));
const saveSettings = () => store.set('reader-settings', settings);
const progress = store.get('reader-progress', {});        // {chapterId: pageIdx}
function saveProgress(chId, idx){
  progress[chId] = idx;
  progress[chId + ':max'] = Math.max(idx, progress[chId + ':max'] ?? -1);
  store.set('reader-progress', progress);
  store.set('reader-last', {chapter: chId, page: idx});
}

/* ---------- icons ---------- */
const I = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  play:'<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  full:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'
};

/* ---------- helpers ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
const pageSrc = (ch, i) => `manga/${encodeURIComponent(ch.id)}/${encodeURIComponent(ch.pages[i])}`;
const readHash = (id, i) => `#read/${encodeURIComponent(id)}/${i}`;

function getRoute(){
  const h = location.hash.slice(1);
  const parts = h.split('/');
  if(parts[0] === 'read' && parts[1]){
    return {view:'read', chapter: decodeURIComponent(parts[1]), page: parseInt(parts[2] || '0', 10) || 0};
  }
  return {view:'list'};
}

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---------- state ---------- */
let manifest = null;
let R = null; // current reader state

/* ---------- home ---------- */
function renderList(app){
  R = null;
  window.onkeydown = null;
  const chapters = manifest.chapters || [];
  document.title = manifest.title || 'Манга';

  const last = store.get('reader-last', null);
  const lastCh = last && chapters.find(c => c.id === last.chapter);
  const cont = lastCh ? `
    <a class="continue" href="${readHash(lastCh.id, last.page)}">
      <span class="play">${I.play}</span>
      <span><div class="t">Продолжить чтение</div>
      <div class="s">${escapeHtml(lastCh.title || lastCh.id)}, страница ${last.page + 1} из ${lastCh.pages.length}</div></span>
    </a>` : '';

  const list = chapters.length === 0
    ? `<div class="empty">Глав пока нет. Добавь папку с картинками в <code>manga/</code> и запиши главу в <code>manga/manifest.json</code>.</div>`
    : `<ol class="chapters">` + chapters.map((ch, i) => {
        const total = (ch.pages || []).length;
        const max = progress[ch.id + ':max'];
        const read = max != null ? max + 1 : 0;
        const pct = total ? Math.round(read / total * 100) : 0;
        const status = read === 0 ? `${total} стр.` : read >= total ? 'Прочитано' : `${read} из ${total}`;
        return `<li><a href="${readHash(ch.id, read > 0 && read < total ? read - 1 : 0)}">
          <span class="n">${i + 1}</span>
          <span class="ct">${escapeHtml(ch.title || ch.id)}</span>
          <span class="cp">${status}</span>
          ${read > 0 ? `<span class="bar"><i style="width:${pct}%"></i></span>` : ''}
        </a></li>`;
      }).join('') + `</ol>`;

  app.innerHTML = `
    <div class="home">
      <h1>${escapeHtml(manifest.title || 'Манга')}</h1>
      <p class="sub">${chapters.length} ${plural(chapters.length, 'глава', 'главы', 'глав')}</p>
      ${cont}
      ${list}
    </div>`;
}

/* ---------- reader ---------- */
function renderReader(app, chapterId, pageIdx){
  const chapters = manifest.chapters || [];
  const chIndex = chapters.findIndex(c => c.id === chapterId);
  const ch = chapters[chIndex];
  if(!ch){
    app.innerHTML = `<div class="empty">Глава «${escapeHtml(chapterId)}» не найдена в manifest.json.<br><a class="btn ghost" href="#">К списку глав</a></div>`;
    return;
  }
  const total = ch.pages.length;
  pageIdx = Math.max(0, Math.min(pageIdx, total - 1));

  // same chapter & mode already open → just move page
  if(R && R.ch === ch && R.mode === settings.mode && document.getElementById('reader')){
    R.show(pageIdx, true);
    return;
  }

  document.title = `${ch.title || ch.id} — ${manifest.title || 'Манга'}`;
  const prevCh = chapters[chIndex - 1], nextCh = chapters[chIndex + 1];

  app.innerHTML = `
    <div class="reader fit-${settings.fit}" id="reader">
      <div class="stage" id="stage"></div>
      <header class="bar top">
        <a class="icon-btn" href="#" aria-label="К списку глав">${I.list}</a>
        <div class="where">
          <div class="ch">${escapeHtml(ch.title || ch.id)}</div>
          <div class="pg" id="pgLabel"></div>
        </div>
        <button class="icon-btn" id="fullBtn" aria-label="Полноэкранный режим">${I.full}</button>
        <button class="icon-btn" id="setBtn" aria-label="Настройки чтения">${I.gear}</button>
      </header>
      <footer class="bar bottom">
        <button class="icon-btn" id="leftBtn"></button>
        <input type="range" id="slider" min="1" max="${total}" value="${pageIdx + 1}" aria-label="Страница">
        <button class="icon-btn" id="rightBtn"></button>
      </footer>
      <div class="scrim" id="scrim" hidden></div>
      <div class="sheet" id="sheet" hidden role="dialog" aria-label="Настройки чтения">
        <h2>Настройки чтения</h2>
        <div class="opt"><div class="lbl">Режим</div>
          <div class="seg" data-key="mode">
            <button data-v="page">По страницам</button><button data-v="strip">Лентой</button>
          </div></div>
        <div class="opt" data-only="page"><div class="lbl">Размер страницы</div>
          <div class="seg" data-key="fit">
            <button data-v="contain">Целиком на экране</button><button data-v="width">По ширине</button>
          </div></div>
        <div class="opt" data-only="page"><div class="lbl">Листать</div>
          <div class="seg" data-key="dir">
            <button data-v="ltr">Слева направо</button><button data-v="rtl">Справа налево</button>
          </div></div>
        <div class="hint">Касание по краю страницы листает, по центру прячет панели. Клавиши: <kbd>←</kbd> <kbd>→</kbd>, <kbd>Пробел</kbd>, <kbd>F</kbd> — полный экран.</div>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </div>`;

  const reader = document.getElementById('reader');
  const stage = document.getElementById('stage');
  const slider = document.getElementById('slider');
  const pgLabel = document.getElementById('pgLabel');
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');
  const rtl = settings.mode === 'page' && settings.dir === 'rtl';

  slider.style.direction = rtl ? 'rtl' : 'ltr';
  leftBtn.innerHTML = I.back; rightBtn.innerHTML = I.next;
  leftBtn.setAttribute('aria-label', rtl ? 'Следующая страница' : 'Предыдущая страница');
  rightBtn.setAttribute('aria-label', rtl ? 'Предыдущая страница' : 'Следующая страница');

  const toggleUI = (force) => reader.classList.toggle('ui-hidden', force);
  const setHash = (i) => history.replaceState(null, '', readHash(ch.id, i));

  function updateChrome(i){
    pgLabel.textContent = `${i + 1} из ${total}`;
    slider.value = i + 1;
    saveProgress(ch.id, i);
  }

  function next(){
    if(R.idx < total - 1) R.show(R.idx + 1);
    else if(nextCh) location.hash = readHash(nextCh.id, 0);
    else toast('Это последняя страница');
  }
  function prev(){
    if(R.idx > 0) R.show(R.idx - 1);
    else if(prevCh) location.hash = readHash(prevCh.id, prevCh.pages.length - 1);
    else toast('Это первая страница');
  }

  R = {ch, mode: settings.mode, idx: pageIdx, next, prev, show: null};

  /* ----- page mode ----- */
  if(settings.mode === 'page'){
    stage.innerHTML = `<div class="page-wrap" id="wrap"><img id="pageImg" alt=""></div><div class="spinner" id="spin" hidden></div>`;
    const img = document.getElementById('pageImg');
    const wrap = document.getElementById('wrap');
    const spin = document.getElementById('spin');
    let spinTimer;

    R.show = (i) => {
      R.idx = i;
      wrap.classList.add('loading');
      clearTimeout(spinTimer);
      spinTimer = setTimeout(() => spin.hidden = false, 250);
      img.alt = `Страница ${i + 1}`;
      img.src = pageSrc(ch, i);
      stage.scrollTop = 0;
      setHash(i);
      updateChrome(i);
      // preload next pages
      for(let k = 1; k <= 2; k++) if(i + k < total) new Image().src = pageSrc(ch, i + k);
    };
    img.onload = () => { clearTimeout(spinTimer); spin.hidden = true; wrap.classList.remove('loading'); };
    img.onerror = () => {
      clearTimeout(spinTimer); spin.hidden = true; wrap.classList.remove('loading');
      toast(`Страница ${R.idx + 1} не загрузилась`);
    };

    // tap zones
    let swiped = false;
    stage.addEventListener('click', (e) => {
      if(swiped){ swiped = false; return; }
      const x = e.clientX / window.innerWidth;
      if(x < 0.3) rtl ? next() : prev();
      else if(x > 0.7) rtl ? prev() : next();
      else toggleUI();
    });

    // swipe
    let t0 = null;
    stage.addEventListener('touchstart', (e) => {
      t0 = e.touches.length === 1 ? {x:e.touches[0].clientX, y:e.touches[0].clientY} : null;
    }, {passive:true});
    stage.addEventListener('touchend', (e) => {
      if(!t0) return;
      if(window.visualViewport && window.visualViewport.scale > 1.05){ t0 = null; return; }
      const dx = e.changedTouches[0].clientX - t0.x;
      const dy = e.changedTouches[0].clientY - t0.y;
      t0 = null;
      if(Math.abs(dx) > 60 && Math.abs(dy) < 60){
        swiped = true;
        const forward = rtl ? dx > 0 : dx < 0;
        forward ? next() : prev();
      }
    });

    leftBtn.onclick = () => rtl ? next() : prev();
    rightBtn.onclick = () => rtl ? prev() : next();
    R.show(pageIdx);
    setTimeout(() => { if(R && R.ch === ch) toggleUI(true); }, 1800);
  }

  /* ----- strip mode ----- */
  else {
    const end = nextCh
      ? `<div class="chapter-end">Конец главы «${escapeHtml(ch.title || ch.id)}»<br><a class="btn" href="${readHash(nextCh.id, 0)}">Читать «${escapeHtml(nextCh.title || nextCh.id)}»</a></div>`
      : `<div class="chapter-end">Это последняя глава.<br><a class="btn ghost" href="#">К списку глав</a></div>`;
    stage.innerHTML = `<div class="strip">` +
      ch.pages.map((p, i) => `<img data-i="${i}" alt="Страница ${i + 1}" loading="lazy" decoding="async" src="${pageSrc(ch, i)}" onload="this.classList.add('ok')">`).join('') +
      end + `</div>`;
    const imgs = [...stage.querySelectorAll('img[data-i]')];

    R.show = (i, jump) => {
      R.idx = i;
      if(jump !== false){
        imgs[i].loading = 'eager';
        imgs[i].scrollIntoView({block:'start'});
        stage.scrollTop -= 56;
      }
      updateChrome(i);
    };

    // track current page while scrolling
    let lastY = 0, ticking = false;
    stage.addEventListener('scroll', () => {
      if(ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        const y = stage.scrollTop;
        if(y > lastY + 12) toggleUI(true);
        else if(y < lastY - 12) toggleUI(false);
        lastY = y;
        const mid = window.innerHeight * 0.4;
        let cur = R.idx;
        for(const im of imgs){
          const r = im.getBoundingClientRect();
          if(r.top <= mid && r.bottom > mid){ cur = +im.dataset.i; break; }
        }
        if(cur !== R.idx){ R.idx = cur; setHash(cur); updateChrome(cur); }
      });
    }, {passive:true});

    stage.addEventListener('click', (e) => { if(e.target.tagName === 'IMG') toggleUI(); });
    leftBtn.onclick = () => R.idx > 0 ? R.show(R.idx - 1) : prev();
    rightBtn.onclick = () => R.idx < total - 1 ? R.show(R.idx + 1) : next();
    R.next = () => stage.scrollBy({top: window.innerHeight * 0.85, behavior:'smooth'});
    R.prev = () => stage.scrollBy({top: -window.innerHeight * 0.85, behavior:'smooth'});
    requestAnimationFrame(() => R.show(pageIdx));
  }

  /* ----- slider ----- */
  slider.oninput = () => { pgLabel.textContent = `${slider.value} из ${total}`; };
  slider.onchange = () => R.show(+slider.value - 1);

  /* ----- settings sheet ----- */
  const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
  const openSheet = (open) => { sheet.hidden = scrim.hidden = !open; };
  document.getElementById('setBtn').onclick = () => openSheet(true);
  scrim.onclick = () => openSheet(false);
  sheet.querySelectorAll('[data-only]').forEach(el => el.hidden = settings.mode !== el.dataset.only);
  sheet.querySelectorAll('.seg').forEach(seg => {
    const key = seg.dataset.key;
    seg.querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-pressed', settings[key] === b.dataset.v);
      b.onclick = () => {
        if(settings[key] === b.dataset.v) return;
        settings[key] = b.dataset.v; saveSettings();
        if(key === 'fit'){
          reader.classList.remove('fit-contain', 'fit-width');
          reader.classList.add('fit-' + settings.fit);
          seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
        } else {
          const keep = R.idx; R = null;
          renderReader(app, ch.id, keep);
          document.getElementById('sheet').hidden = document.getElementById('scrim').hidden = false;
        }
      };
    });
  });

  /* ----- fullscreen ----- */
  document.getElementById('fullBtn').onclick = toggleFull;
  if(!document.documentElement.requestFullscreen) document.getElementById('fullBtn').hidden = true;

  /* ----- keyboard ----- */
  window.onkeydown = (e) => {
    if(e.target.tagName === 'INPUT') return;
    if(!sheet.hidden){ if(e.key === 'Escape') openSheet(false); return; }
    const fwd = rtl ? 'ArrowLeft' : 'ArrowRight', back = rtl ? 'ArrowRight' : 'ArrowLeft';
    if(e.key === fwd || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)){ e.preventDefault(); R.next(); }
    else if(e.key === back || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)){ e.preventDefault(); R.prev(); }
    else if(e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') toggleFull();
    else if(e.key === 'Escape') location.hash = '#';
  };
}

function toggleFull(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
}

/* ---------- boot ---------- */
async function render(){
  const app = document.getElementById('app');
  if(!manifest){
    try{
      const res = await fetch(MANIFEST_URL, {cache:'no-store'});
      if(!res.ok) throw new Error(res.status);
      manifest = await res.json();
    }catch(e){
      app.innerHTML = `<div class="empty">Не удалось загрузить <code>${MANIFEST_URL}</code>.<br>Проверь, что файл лежит в репозитории по этому пути и что в нём корректный JSON.</div>`;
      return;
    }
  }
  const route = getRoute();
  if(route.view === 'read') renderReader(app, route.chapter, route.page);
  else renderList(app);
}

window.addEventListener('hashchange', render);
render();
</script>
